name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 + 不变量 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: 单元测试
        run: python -m pytest tests -q

      - name: 数学不变量 + 跨库交叉验证
        run: python -m morningstar.verify.report --out results --no-bench

      - name: 上传验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-py${{ matrix.python-version }}
          path: results/VERIFICATION.md
          if-no-files-found: ignore

  bench:
    name: 基准评测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: 注意力基准
        run: python -m morningstar.verify.benchmark --out results --lengths 256 512 1024 2048

      - name: 训练闭环冒烟 (60 步)
        run: python examples/train_tiny.py --steps 60 --out results/smoke

      - name: 上传基准结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: |
            results/BENCHMARK.md
            results/benchmark.json
            results/smoke/train_summary.json
          if-no-files-found: ignore

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装检查工具
        run: |
          python -m pip install -U pip
          python -m pip install ruff mypy

      - name: ruff
        run: ruff check morningstar tests examples

      - name: mypy (宽松模式, 仅报告)
        continue-on-error: true
        run: mypy morningstar --ignore-missing-imports
