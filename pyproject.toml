[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagshipai"
version = "1.0.0"
description = "MorningStar FlagshipAI — 世界顶级 AI 系统：零重写·集大成·可验证"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "晨星 (MorningStar)" }]
keywords = [
    "transformer", "gpt", "llm", "flash-attention", "rope", "rmsnorm", "swiglu",
    "attention", "linear-attention", "performer", "favor-plus", "bpe",
    "machine-learning", "deep-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 核心依赖保持最小：数值计算用 numpy，训练/推理/基准全部自包含。
# torch 仅作为**可选**的跨库交叉验证后端（见 morningstar/verify/crosscheck.py）。
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# 跨库交叉验证（与 PyTorch 官方实现逐张量比对梯度）
crosscheck = ["torch>=2.0"]
# 基准评测（pytest-benchmark）
bench = ["pytest>=7.4", "pytest-benchmark>=4.0"]
# 经典机器学习层的对照实验（PCA / GMM / KMeans / SVM）
science = ["scipy>=1.10", "scikit-learn>=1.3"]
# 全量开发环境
dev = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pytest>=7.4",
    "pytest-benchmark>=4.0",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/CJX0712/FlagshipAI"
Repository = "https://github.com/CJX0712/FlagshipAI"
Issues = "https://github.com/CJX0712/FlagshipAI/issues"

[project.scripts]
flagship-verify = "morningstar.verify.report:main"
flagship-bench = "morningstar.verify.benchmark:main"

[tool.setuptools.packages.find]
include = ["morningstar*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
